<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - KaamSetu</title>

<style>

body{
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:30px;
border-radius:16px;
width:380px;
box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

h2{
text-align:center;
margin-bottom:15px;
}

.wallet{
background:#00e5ff;
color:#000;
padding:10px;
border-radius:8px;
text-align:center;
font-weight:bold;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
}

.methods{
margin-top:10px;
}

.methods label{
display:block;
margin:6px 0;
cursor:pointer;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#00e5ff,#007bff);
color:white;
font-size:16px;
cursor:pointer;
}

.success{
display:none;
text-align:center;
margin-top:15px;
color:#00ff9d;
font-weight:bold;
}

.homeBtn{
background:#111;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>💳 Add Money</h2>

<div class="wallet">
Wallet Balance: ₹ <span id="balance">0</span>
</div>

<input type="number" id="amount" placeholder="Enter Amount">

<div class="methods">

<h4>Select Payment Method</h4>

<label><input type="radio" name="pay" value="upi"> UPI</label>
<label><input type="radio" name="pay" value="phonepe"> PhonePe</label>
<label><input type="radio" name="pay" value="gpay"> Google Pay</label>
<label><input type="radio" name="pay" value="card"> Debit / Credit Card</label>

</div>

<button onclick="makePayment()">Pay Now</button>

<div class="success" id="successMsg">
✅ Payment Successful! Money added to wallet.
</div>

<button class="homeBtn" onclick="goHome()">⬅ Back to Home</button>

</div>

<script>

// Load wallet balance
let wallet = localStorage.getItem("walletBalance") || 0;
document.getElementById("balance").innerText = wallet;

function makePayment(){

let amount = document.getElementById("amount").value;
let method = document.querySelector('input[name="pay"]:checked');

if(!amount || amount <= 0){
alert("Enter valid amount");
return;
}

if(!method){
alert("Select payment method");
return;
}

// simulate payment success

wallet = parseInt(wallet) + parseInt(amount);
localStorage.setItem("walletBalance", wallet);

document.getElementById("balance").innerText = wallet;
document.getElementById("successMsg").style.display="block";

document.getElementById("amount").value="";
document.querySelectorAll('input[name="pay"]').forEach(r=>r.checked=false);

}

function goHome(){
window.location.href="index.html";
}

</script>

</body>
</html>
