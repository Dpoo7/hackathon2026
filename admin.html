<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body{
font-family:Arial;
background:#0f2027;
color:white;
margin:0;
}

header{
background:#203a43;
padding:15px;
text-align:center;
font-size:24px;
}

.container{
padding:20px;
}

.card{
background:#2c5364;
padding:15px;
margin-bottom:20px;
border-radius:10px;
}

.item{
background:#1c3a46;
padding:10px;
margin:8px 0;
border-radius:6px;
}
</style>
</head>

<body>

<header>🛠 KaamSetu Admin Dashboard</header>

<div class="container">

<div class="card">
<h2>👤 Registered Users</h2>
<div id="users"></div>
</div>

<div class="card">
<h2>⭐ Feedback</h2>
<div id="feedback"></div>
</div>

<div class="card">
<h2>💼 Client Hire</h2>
<div id="clientHire"></div>
</div>

<div class="card">
<h2>🧰 Labour Hire</h2>
<div id="labourHire"></div>
</div>

</div>

<script>

function showData(key, id){
const data = JSON.parse(localStorage.getItem(key)) || [];
const container=document.getElementById(id);

if(data.length===0){
container.innerHTML="<p>No Data Found</p>";
return;
}

data.forEach(d=>{
const div=document.createElement("div");
div.className="item";
div.innerHTML=Object.values(d).join(" | ");
container.appendChild(div);
});
}

showData("kaamsetuUsers","users");
showData("kaamsetuFeedback","feedback");
showData("clientHire","clientHire");
showData("labourHire","labourHire");

</script>

</body>
</html>
